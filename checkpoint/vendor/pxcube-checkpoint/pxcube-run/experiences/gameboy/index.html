<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Boy cartridge</title>
<style>
  body { margin: 0; background: #0f0f23; color: #e5e5e5; font-family: system-ui, sans-serif;
         display: flex; flex-direction: column; align-items: center; gap: 14px;
         padding: 16px; min-height: 100vh; box-sizing: border-box; }
  #screen { width: min(92vw, 480px); aspect-ratio: 10 / 9; background: #9bbc0f;
            image-rendering: pixelated; border: 10px solid #2a2a3a; border-radius: 10px; }
  #controls { display: flex; gap: 24px; align-items: center; user-select: none; -webkit-user-select: none; }
  #dpad { display: grid; grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(3, 44px); gap: 2px; }
  #dpad button { background: #2a2a3a; color: #e5e5e5; border: none; border-radius: 6px; font-size: 18px; touch-action: none; }
  #dpad button:active { background: #3d3d55; }
  #dpad .up { grid-column: 2; grid-row: 1; } #dpad .left { grid-column: 1; grid-row: 2; }
  #dpad .right { grid-column: 3; grid-row: 2; } #dpad .down { grid-column: 2; grid-row: 3; }
  #actions { display: flex; flex-direction: column; gap: 10px; }
  #actions .row { display: flex; gap: 10px; }
  #actions button { background: #7a1f2b; color: #fff; border: none; border-radius: 50%;
                    width: 56px; height: 56px; font-size: 16px; touch-action: none; }
  #actions button:active { background: #a02c3b; }
  #actions button.small { width: auto; height: auto; border-radius: 12px; padding: 8px 14px;
                          background: #2a2a3a; font-size: 12px; }
  p.hint { font-size: 12px; opacity: .6; margin: 0; text-align: center; }
</style>
</head>
<body>
<canvas id="screen" width="160" height="144"></canvas>
<div id="controls">
  <div id="dpad">
    <button class="up" data-btn="up">▲</button>
    <button class="left" data-btn="left">◀</button>
    <button class="right" data-btn="right">▶</button>
    <button class="down" data-btn="down">▼</button>
  </div>
  <div id="actions">
    <div class="row"><button data-btn="b">B</button><button data-btn="a">A</button></div>
    <div class="row"><button class="small" data-btn="select">SELECT</button><button class="small" data-btn="start">START</button></div>
  </div>
</div>
<p class="hint">Arrows/WASD move · Z = B · X = A · Enter = start · Shift = select</p>
<script src="./player.js"></script>
<script src="./rom.js"></script>
</body>
</html>
