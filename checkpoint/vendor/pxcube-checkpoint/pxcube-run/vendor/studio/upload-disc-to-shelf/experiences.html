<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DiscStudio · Experiences</title>
<link rel="stylesheet" href="./style.css"><style>main{max-width:none;padding:24px}.experience-toolbar{display:flex;gap:12px;align-items:end;flex-wrap:wrap}.experience-toolbar label{min-width:200px;margin:0}#experience-frames{display:grid;gap:16px}#experience-frames.together{grid-template-columns:repeat(auto-fit,minmax(min(600px,100%),1fr))}#experience-frames iframe{width:100%;height:80vh;border:1px solid #638c7e;border-radius:12px;background:#101b17}#experience-frames iframe[hidden]{display:none}#experience-info{max-width:1000px;line-height:1.5;font-size:14px}#experience-source{white-space:pre-wrap}#experience-notice{font-weight:600}#experience-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}#experience-tabs [aria-pressed=true]{outline:2px solid #9bdfc1}</style></head>
<body><header><b>discstudio / Experiences</b><a href="./index.html">Working app</a></header><main>
<div class="experience-toolbar"><label>Experience<select id="experience-choice"></select></label><label>Runnable surface<select id="experience-variant"></select></label><button id="experience-add" type="button">Add sandbox</button></div>
<section id="experience-info"><h1 style="font-size:32px;letter-spacing:-1px" id="experience-title"></h1><p id="experience-status"></p><p id="experience-description"></p><p id="experience-inputs"></p><p id="experience-outputs"></p><p id="experience-notice"></p><details><summary>Actual implementation locations</summary><p id="experience-source"></p></details></section>
<nav id="experience-tabs" aria-label="Open Experience instances"></nav>
<div class="experience-toolbar"><label class="check"><input id="experience-together" type="checkbox"> Show together</label><button id="experience-reset" type="button">New iteration · keep previous</button></div>
<p id="experience-active" role="status"></p><div id="experience-frames"></div>
<p>Switch tabs without losing a running context. New iterations preserve earlier contexts while this page stays open. Export Case reports before leaving this page. No product page assembly is defined here. <a href="./persistence-cases.html">Run persistence Cases</a></p>
</main><script type="module" src="./experiences-host.ts"></script></body></html>
