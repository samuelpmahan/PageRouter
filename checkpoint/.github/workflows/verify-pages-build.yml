name: Verify complete static Pages build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run bundle:fast-check
      - run: git diff --exit-code -- vendor/hh/src/vendor
      - run: npm test
      - run: npm run build:pxcube
      - run: npm run build
      - run: node scripts/verify-crisp-delta.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: composed-workbench-static-pages
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: composed-workbench-evidence
          path: evidence
# Deliberately no deploy job until a distinct repository/Pages destination is approved.
