name: Build and deploy PageRouter from source

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate source build root
        id: source
        shell: bash
        run: |
          if [[ -f package.json && -f BUILD.bazel ]]; then
            echo 'root=.' >> "$GITHUB_OUTPUT"
          elif [[ -f checkpoint/package.json && -f checkpoint/BUILD.bazel ]]; then
            echo 'root=checkpoint' >> "$GITHUB_OUTPUT"
          else
            echo 'No PageRouter source build root found' >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version-file: ${{ steps.source.outputs.root }}/.nvmrc
      - name: Install pinned Bazel
        shell: bash
        run: |
          version="$(cat '${{ steps.source.outputs.root }}/.bazelversion')"
          [[ "$version" == '7.4.1' ]]
          curl --fail --location --retry 3 "https://github.com/bazelbuild/bazel/releases/download/${version}/bazel-${version}-linux-x86_64" --output "$RUNNER_TEMP/bazel"
          echo "c97f02133adce63f0c28678ac1f21d65fa8255c80429b588aeeba8a1fac6202b  $RUNNER_TEMP/bazel" | sha256sum --check
          chmod +x "$RUNNER_TEMP/bazel"
      - name: Bazel source build and verification
        working-directory: ${{ steps.source.outputs.root }}
        env:
          BAZEL: ${{ runner.temp }}/bazel
          PAGEROUTER_BAZEL_OUTPUT_ROOT: ${{ runner.temp }}/bazel-output
        run: bash ci/bazel/run.sh
      - name: Upload build evidence
        uses: actions/upload-artifact@v4
        with:
          name: pagerouter-source-build-evidence
          path: |
            ${{ steps.source.outputs.root }}/bazel-bin/site.receipt.json
            ${{ steps.source.outputs.root }}/bazel-bin/site.log
            ${{ steps.source.outputs.root }}/bazel-bin/site.evidence
          if-no-files-found: error
      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.source.outputs.root }}/bazel-bin/site.site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy freshly built site
        id: deployment
        uses: actions/deploy-pages@v4
