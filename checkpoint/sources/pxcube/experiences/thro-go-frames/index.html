<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>thro-go frame lab</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="mark">thro-go</span><span class="sub">frame lab</span></div>
  <nav class="tabs" id="tabs" aria-label="Views">
    <button data-view="cases">Cases</button>
    <button data-view="sponsors">Sponsors</button>
    <button data-view="links">Links</button>
    <button data-view="frames">Frames</button>
    <button data-view="pipeline">Pipeline</button>
  </nav>
  <div class="status" id="status" aria-live="polite">loading the season…</div>
</header>
<div class="shell" id="shell" data-view="cases">
  <aside class="list" id="list" aria-label="Cases"></aside>
  <main class="main" id="main" tabindex="-1"></main>
</div>
<script type="module" src="page.mjs"></script>
</body>
</html>
