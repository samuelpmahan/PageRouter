<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1611">
<title>Which card would you put on screen?</title>
<meta name="description" content="Eleven overlay cards for disc golf videos. Thirty seconds: tap the one or two you'd put on screen, then paste your pick in the thread.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none' stroke='%23c8f49d' stroke-width='3'%3E%3Ccircle cx='16' cy='16' r='13'/%3E%3Ccircle cx='16' cy='16' r='5.75'/%3E%3C/svg%3E">
<style>
:root{--ground:#0f1611;--panel:#17211a;--line:#2c3b2f;--ink:#eef3ea;--muted:#a3b39e;--accent:#c8f49d;--pick:#ffd166}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100dvh;display:flex;flex-direction:column}
header{padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left));display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline}
h1{font-size:clamp(19px,2.4vw,26px);margin:0;letter-spacing:-.5px;font-weight:750}
header p{margin:0;color:var(--muted);font-size:13.5px;max-width:70ch}
header .who{font-size:12.5px;color:var(--muted);margin-left:auto}
main{flex:1;align-content:start;padding:6px max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));display:grid;gap:10px}
.row{display:grid;gap:8px;align-items:start}
.row.landscape{grid-template-columns:repeat(5,minmax(0,1fr))}
.row.portrait{grid-template-columns:repeat(6,minmax(0,1fr))}
.card{position:relative;padding:0;border:2px solid var(--line);border-radius:11px;overflow:hidden;background:#000;cursor:pointer;color:var(--ink);text-align:left;font:inherit}
.card canvas{display:block;width:100%;height:auto}
.card .name{position:absolute;left:0;right:38px;top:0;padding:6px 8px 12px;font:650 11.5px/1.2 system-ui,sans-serif;background:linear-gradient(#000b,transparent)}
.card .check{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;border:2px solid #fff;background:#0008;display:grid;place-items:center;font:800 14px system-ui;color:transparent}
.card[aria-pressed=true]{border-color:var(--pick);box-shadow:0 0 0 2px var(--pick)}
.card[aria-pressed=true] .check{background:var(--pick);border-color:var(--pick);color:#1d1a0b}
.card .tally{position:absolute;left:0;right:0;bottom:0;padding:5px 8px;font:700 12px/1.2 system-ui,sans-serif;background:#000c;display:flex;align-items:center;gap:7px}
.card .tally i{display:block;height:6px;background:var(--pick);border-radius:3px;min-width:2px}
.card .wait{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:12px}
.card:focus-visible,button:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
footer{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px max(16px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));border-top:1px solid var(--line);background:#141d16;position:sticky;bottom:0}
footer label{flex:1 1 320px;display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
textarea{width:100%;min-height:42px;max-height:120px;resize:vertical;border:1px solid #405043;border-radius:9px;padding:9px 10px;background:#0d150f;color:var(--ink);font:14px/1.4 system-ui,sans-serif}
footer .status{font-size:13px;color:var(--muted);min-width:150px}
#copy-fallback{flex:1 1 100%;min-height:70px}
footer .status b{color:var(--ink)}
footer button{min-height:46px;padding:10px 22px;border-radius:11px;border:1px solid var(--accent);background:var(--accent);color:#16230f;font:750 15px system-ui,sans-serif;cursor:pointer}
footer button:disabled{opacity:.4;cursor:default}
@media (max-width:640px){footer{position:static}}
@media (max-width:900px){.row.landscape{grid-template-columns:repeat(2,minmax(0,1fr))}.row.portrait{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .12s,box-shadow .12s}.card .tally i{transition:width .5s}}
</style>
</head>
<body>
<header>
  <h1>Which card would you put on screen?</h1>
  <p>Tap the one or two you'd put on a disc golf video, then <b>Copy feedback</b> and paste it in the thread.</p>
</header>
<main id="main" aria-busy="true">
  <div class="row landscape" id="landscape" aria-label="Cards for landscape video"></div>
  <div class="row portrait" id="portrait" aria-label="Cards for Shorts, Reels and TikTok"></div>
</main>
<footer>
  <label for="note">What would you change? <span>(optional)</span><textarea id="note" maxlength="600" placeholder="Anything: what's ugly, what's missing, what you'd never use"></textarea></label>
  <span class="status" id="status" role="status">Tap one or two.</span>
  <textarea id="copy-fallback" readonly hidden aria-label="Your feedback, to copy"></textarea>
  <button type="button" id="send" disabled>Copy feedback</button>
</footer>
<script type="module" src="./ask.mjs"></script>
</body>
</html>
