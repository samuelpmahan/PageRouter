<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card revision 2</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#0d140f;--panel:#151f18;--line:#2a3a30;--ink:#e9f1e4;--muted:#9fb0a3;--lime:#c8f49d;--gold:#ffd166}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:#0d140fee;backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:12px 16px}
header h1{margin:0 0 6px;font-size:20px}
header a{color:var(--lime)}
.decide{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.decide button{min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:#1b281f;color:var(--ink);font:600 14px system-ui,sans-serif;cursor:pointer}
.decide button[aria-pressed="true"]{background:var(--gold);color:#1d1600;border-color:var(--gold)}
#recorded,#progress{margin:6px 0 0;color:var(--muted);font-size:13px}
main{padding:8px 16px 48px;max-width:1240px;margin:0 auto}
.layout{border-bottom:1px solid var(--line);padding:12px 0}
.layout h2{font-size:17px;margin:4px 0 8px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.layout h2 small{color:var(--muted);font-weight:600}
.same{font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;background:#2d3a31;color:#d8e2da}
.same.changes{background:var(--gold);color:#1d1600}
.discs{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:12px}
.layout.collapsed .discs{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.disc h3{font-size:13px;color:var(--muted);margin:0 0 4px;font-weight:600}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pair.one{grid-template-columns:1fr}
.rev{margin:0 0 3px;font-weight:800;font-size:13px;color:var(--lime)}.rev small{color:var(--muted);font-weight:500}
.card{margin:0;background:repeating-conic-gradient(#1b241e 0 25%,#141b16 0 50%) 0 0/16px 16px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.card img{display:block;width:100%;height:auto}
figcaption{padding:6px 8px;background:var(--panel);font-size:12px;display:grid;gap:4px}
.order i{display:inline-grid;place-items:center;min-width:16px;height:16px;margin:0 2px 0 4px;border-radius:4px;background:#2b2f2c;color:#d8ddd9;font:700 11px/1 system-ui,sans-serif;font-style:normal}
.order i:first-child{margin-left:0}
.thus{color:#cfe3c9}
.layout.collapsed .thus{display:none}
@media (max-width:520px){.discs{grid-template-columns:1fr}.layout.collapsed .discs{grid-template-columns:1fr 1fr}.pair{gap:6px}}
</style>
</head>
<body>
<header>
  <h1>Card revision 2 <small style="font-size:13px;font-weight:500;color:var(--muted)">· <a href="./?dtree">back to thro</a></small></h1>
  <div class="decide" role="group" aria-label="Your decision on card revision 2">
    <button type="button" data-choice="accept">Accept revision 2</button>
    <button type="button" data-choice="keep-1">Keep revision 1</button>
    <button type="button" data-choice="not-yet">Not yet</button>
  </div>
  <p id="recorded"></p>
  <p id="progress">Drawing the cards…</p>
</header>
<main id="layouts"></main>
<script type="module" src="./revision-review.mjs"></script>
</body>
</html>
