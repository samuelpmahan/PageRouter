name: Parallel Compressing Bootstrap

on:
  push:
    branches:
      - parallel-compressing-bootstrap
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/parallel-compressing-bootstrap'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the branch source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up the pinned acquisition Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.4'
          check-latest: false

      - name: Build and verify through the pinned Bazel recipe
        run: bash ci/bazel/run.sh

      - name: Upload declared Bazel outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pagerouter-bazel-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            bazel-bin/pagerouter_site.site/
            bazel-bin/pagerouter_site.evidence/
            bazel-bin/pagerouter_site.receipt.json
            bazel-bin/pagerouter_site.diagnostics.txt
            bazel-testlogs/pagerouter_verify/test.log
            verification/
          if-no-files-found: warn
          retention-days: 14
