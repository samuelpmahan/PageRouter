<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PageRouter</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #101114; color: #f5f7fa; height: 100vh; overflow: hidden; }
    header { height: 58px; display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid #2a2d33; background: #17191e; }
    #title { font-weight: 750; margin-right: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    button, select { border: 1px solid #3a3f48; background: #22262d; color: inherit; border-radius: 8px; padding: 8px 11px; font: inherit; }
    button { cursor: pointer; }
    button:hover, select:hover { background: #2b3038; }
    button.active { background: #f5f7fa; color: #111318; border-color: #f5f7fa; }
    .mode { display: flex; gap: 6px; }
    #singleControls { display: flex; gap: 6px; min-width: 0; }
    #compareControls { display: none; gap: 6px; align-items: center; }
    #view { height: calc(100vh - 58px); display: grid; grid-template-columns: 1fr; background: white; }
    #view.compare { grid-template-columns: 1fr 1fr; gap: 2px; background: #2a2d33; }
    iframe { width: 100%; height: 100%; border: 0; background: white; }
    #rightFrame { display: none; }
    #view.compare #rightFrame { display: block; }
    .error { padding: 24px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; }
    @media (max-width: 760px) {
      header { height: auto; min-height: 58px; flex-wrap: wrap; }
      #title { width: 100%; }
      #view { height: calc(100vh - 104px); }
    }
  </style>
</head>
<body>
  <header>
    <div id="title">PageRouter</div>
    <div id="singleControls"></div>
    <div id="compareControls">
      <select id="leftSelect" aria-label="Left site"></select>
      <span>vs</span>
      <select id="rightSelect" aria-label="Right site"></select>
    </div>
    <div class="mode">
      <button id="singleMode" class="active">Single</button>
      <button id="compareMode">Compare</button>
    </div>
  </header>

  <main id="view">
    <iframe id="leftFrame" title="Selected frontend"></iframe>
    <iframe id="rightFrame" title="Comparison frontend"></iframe>
  </main>

  <script>
    const state = { config: null, left: 0, right: 1, compare: false };
    const title = document.querySelector('#title');
    const singleControls = document.querySelector('#singleControls');
    const compareControls = document.querySelector('#compareControls');
    const singleMode = document.querySelector('#singleMode');
    const compareMode = document.querySelector('#compareMode');
    const view = document.querySelector('#view');
    const leftFrame = document.querySelector('#leftFrame');
    const rightFrame = document.querySelector('#rightFrame');
    const leftSelect = document.querySelector('#leftSelect');
    const rightSelect = document.querySelector('#rightSelect');

    function loadFrame(frame, index) {
      const site = state.config.sites[index];
      if (site) frame.src = site.url;
    }

    function render() {
      const sites = state.config.sites;
      singleControls.innerHTML = '';
      sites.forEach((site, index) => {
        const button = document.createElement('button');
        button.textContent = site.label;
        button.className = !state.compare && index === state.left ? 'active' : '';
        button.onclick = () => { state.left = index; loadFrame(leftFrame, index); render(); };
        singleControls.appendChild(button);
      });

      const options = sites.map((site, i) => `<option value="${i}">${site.label}</option>`).join('');
      leftSelect.innerHTML = options;
      rightSelect.innerHTML = options;
      leftSelect.value = String(state.left);
      rightSelect.value = String(state.right);

      view.classList.toggle('compare', state.compare);
      singleControls.style.display = state.compare ? 'none' : 'flex';
      compareControls.style.display = state.compare ? 'flex' : 'none';
      singleMode.classList.toggle('active', !state.compare);
      compareMode.classList.toggle('active', state.compare);
    }

    singleMode.onclick = () => { state.compare = false; render(); };
    compareMode.onclick = () => { state.compare = true; loadFrame(rightFrame, state.right); render(); };
    leftSelect.onchange = () => { state.left = Number(leftSelect.value); loadFrame(leftFrame, state.left); };
    rightSelect.onchange = () => { state.right = Number(rightSelect.value); loadFrame(rightFrame, state.right); };

    fetch('./pagerouter.json', { cache: 'no-store' })
      .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
      .then(config => {
        if (!config.sites?.length) throw new Error('pagerouter.json must define at least one site');
        state.config = config;
        state.right = Math.min(1, config.sites.length - 1);
        title.textContent = config.title || 'PageRouter';
        document.title = config.title || 'PageRouter';
        loadFrame(leftFrame, state.left);
        render();
      })
      .catch(error => {
        document.body.innerHTML = `<div class="error">PageRouter config failed to load:\n${error.message}</div>`;
      });
  </script>
</body>
</html>
